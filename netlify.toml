[build]
command = "npm run build:netlify"
publish = "out"
[[redirects]]
from = "/*"
to = "/index.html"
status = 200
[[headers]]
for = "/sw.js"
[headers.values]
Cache-Control = "no-cache"
[[headers]]
for = "/*"
[headers.values]
X-Content-Type-Options = "nosniff"
Referrer-Policy = "strict-origin-when-cross-origin"
